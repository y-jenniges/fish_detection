name: build

# Builds standalone MarOMarker apps for Windows, macOS and Linux.
# PyInstaller cannot cross compile, so each app is built on its own runner.
# On a version tag (v*) the builds are attached to the GitHub Release for
# that tag. Manual runs (workflow_dispatch) keep them as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: MarOMarker

jobs:
  build:
    permissions:
      contents: write   # needed to publish the release assets
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and build tools
        run: pip install -e .[dev]

      - name: Build with PyInstaller
        run: pyinstaller maromarker.spec

      - name: Upload application as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarOMarker-${{ matrix.os }}
          path: MarOMarker/dist/MarOMarker

      # -- release packaging, only on a version tag ------------------------- #
      - name: Zip the app (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MarOMarker -DestinationPath MarOMarker-${{ matrix.os }}.zip

      - name: Zip the app (macOS/Linux)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r ../MarOMarker-${{ matrix.os }}.zip MarOMarker

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "MarOMarker-${{ matrix.os }}.zip" --clobber
